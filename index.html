<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F3E8" />
    <script>
      try {
        var preference = localStorage.getItem('nexo.theme');
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171c19' : '#f7f3e8';
      } catch (_) {}
    </script>
    <meta
      name="description"
      content="Seu dinheiro, sem complicação. Anote gastos e entradas pelo WhatsApp e acompanhe seu mês no Nexo."
    />
    <title>Nexo</title>
    <link rel="icon" type="image/png" href="/logo_letra_n.png" />
    <link rel="apple-touch-icon" href="/logo_letra_n.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
